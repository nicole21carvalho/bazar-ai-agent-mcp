name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# O GITHUB_TOKEN so le o codigo.
permissions:
  contents: read

# Actions fixadas por SHA do commit, e nao por tag: tag pode ser movida para
# outro codigo depois (foi assim no ataque ao tj-actions/changed-files em 2025);
# SHA nao. O comentario diz a versao, e o Dependabot abre PR quando sai outra.

jobs:
  testes:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Instalar dependencias
        # --frozen: falha se o uv.lock nao bater com o pyproject.toml, em vez de
        # resolver versoes novas em silencio.
        run: uv sync --frozen --all-extras

      - name: Lint (Ruff, com as regras de seguranca do Bandit)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tipos (mypy strict)
        run: uv run mypy src tests avaliacao

      - name: Testes (com um modelo roteirizado, sem IA de verdade)
        run: uv run pytest

  vulnerabilidades:
    name: Dependências com vulnerabilidade conhecida
    runs-on: ubuntu-latest
    env:
      OSV_VERSAO: v2.6.0
      OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar osv-scanner
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSAO}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner

      - name: Varredura do uv.lock
        run: ./osv-scanner scan source -L uv.lock

  imagem:
    name: Imagem Docker · build
    runs-on: ubuntu-latest
    needs: [testes, vulnerabilidades]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
